<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Deep Dive app icon: the diver plunging down through a sunlit trench, in the game's outlined
       cartoon style. The diver stays inside the central 80% so the maskable crop keeps it whole. -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe0ff"/>
      <stop offset=".45" stop-color="#1c8fd6"/>
      <stop offset="1" stop-color="#0a2f66"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset=".55" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#e9a514"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f2f"/>
      <stop offset="1" stop-color="#ff9a4d"/>
    </linearGradient>
    <radialGradient id="glass" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#d8f8ff"/>
      <stop offset=".55" stop-color="#57c9f3"/>
      <stop offset="1" stop-color="#1f86c8"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6c8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sea)"/>
  <!-- Light rays from the surface -->
  <path d="M70 0h70L60 512H-40Z M230 0h50L210 512h-90Z M370 0h60L380 512h-80Z" fill="url(#ray)"/>
  <!-- Trench walls -->
  <path d="M0 512V440q40-26 76-10t64-18q34-20 64 2 30 22 68 6t66-26q48-18 86 4t88 14v100Z" fill="#0b2f5e"/>
  <path d="M0 440q40-26 76-10t64-18q34-20 64 2 30 22 68 6t66-26q48-18 86 4t88 14" fill="none" stroke="#16233b" stroke-width="10" stroke-linejoin="round"/>
  <g fill="#ff7aa8" stroke="#16233b" stroke-width="7"><circle cx="86" cy="466" r="18"/><circle cx="114" cy="452" r="13"/></g>
  <g fill="#b07cff" stroke="#16233b" stroke-width="7"><circle cx="424" cy="456" r="16"/><circle cx="450" cy="446" r="11"/></g>

  <circle cx="276" cy="246" r="150" fill="url(#glow)"/>

  <!-- Bubbles trailing up from the diver -->
  <g fill="#e8fbff" fill-opacity=".25" stroke="#e8fbff" stroke-width="7">
    <circle cx="150" cy="150" r="20"/><circle cx="120" cy="98" r="13"/><circle cx="160" cy="62" r="9"/>
  </g>

  <!-- The diver, plunging head-first down to the right -->
  <g transform="translate(262 262) rotate(32)" stroke="#16233b" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-96 -18 -168 -62q-14 22 -8 44l64 26Z" fill="url(#fin)"/>
    <path d="M-96 18 -168 62q-14-22-8-44l64-26Z" fill="url(#fin)"/>
    <rect x="-70" y="-84" width="96" height="40" rx="20" fill="#dfe7ef"/>
    <rect x="-40" y="-94" width="22" height="14" rx="5" fill="#ff5a7a"/>
    <ellipse cx="-14" cy="0" rx="98" ry="58" fill="url(#body)"/>
    <path d="M-60 -6v14M-36 -8v18" stroke="#16233b" stroke-width="9"/>
    <circle cx="78" cy="-2" r="58" fill="#eef3f8"/>
    <circle cx="86" cy="-2" r="40" fill="url(#glass)"/>
    <g stroke="none" fill="#16233b"><circle cx="76" cy="-10" r="7"/><circle cx="102" cy="-10" r="7"/></g>
    <path d="M78 10q11 10 22 0" fill="none" stroke-width="7"/>
    <path d="M58 -26q12-16 30-18" fill="none" stroke="#fff" stroke-width="7" stroke-opacity=".9"/>
  </g>
</svg>
